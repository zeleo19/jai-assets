<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" preserveAspectRatio="none" width="300" height="400" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect x="1" y="1" width="98" height="98" fill="none" stroke="#f1d9a0" stroke-opacity="0.45" stroke-width="1" vector-effect="non-scaling-stroke"/>
