<animate attributeName="stroke-dashoffset" values="100;0" dur="5s" repeatCount="indefinite"/>
</rect>
<rect x="1" y="1" width="98" height="98" pathLength="100" fill="none" stroke="#d9b45e" stroke-width="2" stroke-opacity="0.8" stroke-dasharray="6 94" stroke-linecap="round" vector-effect="non-scaling-stroke">
